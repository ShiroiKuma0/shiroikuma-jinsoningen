org.gradle.parallel=true
android.defaults.buildfeatures.shaders=false
android.useAndroidX=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx6g -Xms256m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC

# === shiroikuma-jinsoningen fork versioning (see app/build.gradle.kts + the build-apk skill) ===
# The upstream base (versionName / versionCode) lives in app/build.gradle.kts and is never
# hand-edited — a rebase brings it in. BUILD_NUMBER is OUR per-build N: bumped after every
# successful `buildFork`, reset to 1 on every upstream sync by /upstream-new-version.
#   versionName = "<upstream name>+<N zero-padded to 3>"   e.g. 0.7.4+001
#   versionCode = <upstream code> * 10000 + N              e.g. 740 * 10000 + 1 = 7400001
BUILD_NUMBER=9
